<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}SBA{% endblock %} — Sports Betting Analytics</title>
    <link rel="stylesheet" href="/static/css/style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body>
    <!-- Sidebar Navigation -->
    <nav class="sidebar" id="sidebar">
        <div class="sidebar-brand">
            <div class="brand-icon">SBA</div>
            <span class="brand-text">Sports Betting<br>Analytics<small>Premium Edge Finder</small></span>
        </div>

        <div class="nav-section">
            <div class="nav-label">Main</div>
            <a href="/" class="nav-link" data-page="dashboard">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg>
                <span>Dashboard</span>
            </a>
            <a href="/edges" class="nav-link" data-page="edges">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="23 6 13.5 15.5 8.5 10.5 1 18"/><polyline points="17 6 23 6 23 12"/></svg>
                <span>Edge Finder</span>
            </a>

            <div class="nav-label">Analysis</div>
            <a href="/props" class="nav-link" data-page="props">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
                <span>Player Props</span>
                <span class="nav-badge">ML</span>
            </a>
            <a href="/my-bets" class="nav-link" data-page="bets">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="3" width="20" height="18" rx="2"/><line x1="2" y1="9" x2="22" y2="9"/><line x1="10" y1="3" x2="10" y2="21"/></svg>
                <span>My Bets</span>
            </a>
        </div>

        <div class="sidebar-footer">
            <div class="status-indicator" id="api-status">
                <span class="status-dot"></span>
                <span class="status-text">Loading...</span>
            </div>
        </div>
    </nav>

    <!-- Main Content -->
    <main class="main-content">
        <header class="top-bar">
            <div class="top-bar-left">
                <button class="menu-toggle" onclick="document.getElementById('sidebar').classList.toggle('open')">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
                </button>
            </div>
            <div class="top-bar-right">
                <div class="search-box">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
                    <input type="text" placeholder="Search players..." id="player-search" autocomplete="off">
                    <span class="search-kbd">/</span>
                    <div class="search-results" id="search-results"></div>
                </div>
                <div class="live-clock" id="live-clock"></div>
            </div>
        </header>

        <div class="content-area">
            {% block content %}{% endblock %}
        </div>
    </main>

    <!-- Bet Slip Sidebar -->
    <aside class="bet-slip" id="bet-slip">
        <div class="bet-slip-header">
            <h3>
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="18" height="18"><rect x="2" y="3" width="20" height="18" rx="2"/><line x1="2" y1="9" x2="22" y2="9"/></svg>
                Bet Slip
            </h3>
            <span class="bet-count" id="bet-count">0</span>
        </div>
        <div class="bet-slip-body" id="bet-slip-body">
            <div class="empty-slip">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" width="48" height="48"><rect x="2" y="3" width="20" height="18" rx="2"/><line x1="2" y1="9" x2="22" y2="9"/></svg>
                <p>Add selections to your bet slip</p>
                <p class="text-dim" style="font-size:11px">Click odds on any edge to add</p>
            </div>
        </div>
        <div class="bet-slip-footer" id="bet-slip-footer" style="display:none">
            <button class="btn btn-primary btn-block" onclick="SBA.placeBets()">Track All Bets</button>
            <button class="btn btn-outline btn-block" onclick="SBA.clearSlip()">Clear Slip</button>
        </div>
    </aside>

    <!-- Toast Container -->
    <div class="toast-container" id="toast-container"></div>

    <script src="/static/js/app.js"></script>
    {% block scripts %}{% endblock %}
</body>
</html>

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "sports-betting-analytics"
version = "0.1.0"
description = "Sports betting edge finder and prop bet analyzer"
requires-python = ">=3.9"
dependencies = [
    "httpx>=0.27",
    "rich>=13.0",
    "typer>=0.12",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "pandas>=2.0",
    "numpy>=1.24",
    "scikit-learn>=1.3",
    "xgboost>=2.0",
    "joblib>=1.3",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.21",
    "respx>=0.21",
]

[project.scripts]
sba = "sba.cli.app:main"

[tool.hatch.build.targets.wheel]
packages = ["src/sba"]

{% extends "base.html" %}
{% block title %}My Bets{% endblock %}

{% block content %}
<h1 class="page-title">My Bets</h1>

<div class="stats-grid" id="bets-summary">
    <div class="stat-card green">
        <div class="stat-label">Total P/L</div>
        <div class="stat-value">—</div>
    </div>
    <div class="stat-card blue">
        <div class="stat-label">Win Rate</div>
        <div class="stat-value">—</div>
    </div>
    <div class="stat-card yellow">
        <div class="stat-label">Total Staked</div>
        <div class="stat-value">—</div>
    </div>
    <div class="stat-card purple">
        <div class="stat-label">Pending</div>
        <div class="stat-value">—</div>
    </div>
</div>

<div class="card">
    <div class="card-header">
        <h3>
            <svg class="header-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="18" height="18"><rect x="2" y="3" width="20" height="18" rx="2"/><line x1="2" y1="9" x2="22" y2="9"/></svg>
            Bet History
        </h3>
    </div>
    <div class="card-body">
        <div style="overflow-x:auto">
            <table class="data-table">
                <thead>
                    <tr>
                        <th class="sortable" onclick="SBA.sortTable('bets-table-body', 0)">Date</th>
                        <th class="sortable" onclick="SBA.sortTable('bets-table-body', 1)">Selection</th>
                        <th class="sortable" onclick="SBA.sortTable('bets-table-body', 2)">Market</th>
                        <th class="right sortable" onclick="SBA.sortTable('bets-table-body', 3, 'number')">Odds</th>
                        <th class="right sortable" onclick="SBA.sortTable('bets-table-body', 4, 'number')">Stake</th>
                        <th class="right sortable" onclick="SBA.sortTable('bets-table-body', 5)">Book</th>
                        <th class="center sortable" onclick="SBA.sortTable('bets-table-body', 6)">Status</th>
                        <th class="right sortable" onclick="SBA.sortTable('bets-table-body', 7, 'number')">P/L</th>
                    </tr>
                </thead>
                <tbody id="bets-table-body">
                    <tr><td colspan="8" class="loading-spinner"><div class="spinner"></div> Loading bet history...</td></tr>
                </tbody>
            </table>
        </div>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script>
document.addEventListener('DOMContentLoaded', () => SBA.loadBets());
</script>
{% endblock %}

{% extends "base.html" %}
{% block title %}Odds Screen{% endblock %}

{% block content %}
<h1 class="page-title reveal-up">
    <span class="gradient-text animated-gradient-text">Odds Screen</span>
    <span class="tag-elite">Pro</span>
</h1>

<div class="dashboard-grid">
    <!-- Filters -->
    <div class="card full-width frosted-panel reveal-up" style="animation-delay:0.05s">
        <div class="card-body padded" style="display:flex;gap:8px;flex-wrap:wrap;align-items:center">
            <select class="filter-select" id="os-sport" onchange="loadOddsScreen()" style="width:160px">
                <option value="">All Sports</option>
            </select>
            <select class="filter-select" id="os-market" onchange="loadOddsScreen()" style="width:140px">
                <option value="h2h">Moneyline</option>
                <option value="spreads">Spreads</option>
                <option value="totals">Totals</option>
            </select>
            <button class="btn btn-primary" onclick="loadOddsScreen()">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="14" height="14"><polyline points="23 4 23 10 17 10"/><path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"/></svg>
                Refresh
            </button>
            <span class="text-dim" style="margin-left:auto;font-size:12px" id="os-update-time"></span>
        </div>
    </div>

    <!-- Main Odds Table -->
    <div class="card full-width featured-card frosted-panel reveal-up" style="animation-delay:0.1s">
        <div class="card-header">
            <h3>
                <svg class="header-icon icon-bounce" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="18" height="18"><rect x="3" y="3" width="18" height="18" rx="2"/><line x1="3" y1="9" x2="21" y2="9"/><line x1="9" y1="21" x2="9" y2="9"/></svg>
                Live Odds Comparison
                <span class="badge" id="os-count">0</span>
            </h3>
        </div>
        <div class="card-body">
            <div style="overflow-x:auto">
                <table class="data-table" id="os-table">
                    <thead id="os-thead"><tr><th>Event</th><th>Time</th></tr></thead>
                    <tbody id="os-tbody">
                        <tr><td colspan="10" class="empty-state"><p>Loading odds...</p></td></tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <!-- Consensus View -->
    <div class="card full-width reveal-up" style="animation-delay:0.15s">
        <div class="card-header">
            <h3>
                <svg class="header-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="18" height="18"><path d="M22 12h-4l-3 9L9 3l-3 9H2"/></svg>
                Quick Consensus
            </h3>
        </div>
        <div class="card-body padded">
            <div style="display:flex;gap:8px;margin-bottom:12px">
                <input type="text" id="cons-event" placeholder="Event ID" class="premium-input" style="flex:1">
                <button class="btn btn-primary" onclick="loadConsensus()">Get Consensus</button>
            </div>
            <div id="cons-result">
                <div class="empty-state" style="padding:20px"><p>Enter an event ID to see consensus odds</p></div>
            </div>
        </div>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script>
async function loadSports() {
    try {
        const resp = await fetch('/api/sports');
        const sports = await resp.json();
        const sel = document.getElementById('os-sport');
        sports.forEach(s => {
            const opt = document.createElement('option');
            opt.value = s.key;
            opt.textContent = `${s.title} (${s.event_count})`;
            sel.appendChild(opt);
        });
    } catch (err) {
        console.error('Failed to load sports:', err);
    }
}

async function loadOddsScreen() {
    const sport = document.getElementById('os-sport').value;
    const market = document.getElementById('os-market').value;
    try {
        let url = `/api/odds-screen?market=${market}`;
        if (sport) url += `&sport=${encodeURIComponent(sport)}`;
        const resp = await fetch(url);
        const data = await resp.json();
        const events = data.events || [];
        const books = data.bookmakers || [];
        document.getElementById('os-count').textContent = events.length;
        document.getElementById('os-update-time').textContent = 'Updated: ' + new Date().toLocaleTimeString();

        // Build header
        const thead = document.getElementById('os-thead');
        let headerHtml = '<tr><th>Event</th><th>Time</th>';
        books.forEach(b => headerHtml += `<th class="right" style="font-size:11px">${b}</th>`);
        headerHtml += '<th class="right">Best</th></tr>';
        thead.innerHTML = headerHtml;

        const tbody = document.getElementById('os-tbody');
        if (events.length === 0) {
            tbody.innerHTML = `<tr><td colspan="${books.length + 3}" class="empty-state"><p>No odds data available</p></td></tr>`;
        } else {
            tbody.innerHTML = events.map(ev => {
                let rows = '';
                (ev.outcomes || []).forEach((out, oi) => {
                    rows += '<tr>';
                    if (oi === 0) {
                        rows += `<td class="font-bold" rowspan="${ev.outcomes.length}">${ev.home} vs ${ev.away}</td>`;
                        rows += `<td class="text-dim" rowspan="${ev.outcomes.length}" style="font-size:12px">${new Date(ev.commence_time).toLocaleDateString()}</td>`;
                    }
                    books.forEach(b => {
                        const odds = out.odds && out.odds[b];
                        const isBest = odds && out.best_book === b;
                        rows += `<td class="right font-mono ${isBest ? 'text-green font-bold' : ''}" style="font-size:12px">${odds ? (odds > 0 ? '+' : '') + odds : '—'}</td>`;
                    });
                    rows += `<td class="right font-mono font-bold text-green" style="font-size:12px">${out.best_odds ? (out.best_odds > 0 ? '+' : '') + out.best_odds : '—'}</td>`;
                    rows += '</tr>';
                });
                return rows;
            }).join('');
        }
    } catch (err) {
        console.error('Failed to load odds screen:', err);
    }
}

async function loadConsensus() {
    const eventId = document.getElementById('cons-event').value.trim();
    if (!eventId) { SBA.toast('Enter an event ID', 'error'); return; }

    try {
        const resp = await fetch(`/api/consensus/${encodeURIComponent(eventId)}`);
        const d = await resp.json();
        if (resp.status !== 200) { SBA.toast(d.detail || 'Error', 'error'); return; }

        const el = document.getElementById('cons-result');
        const outcomes = d.outcomes || [];
        if (outcomes.length === 0) {
            el.innerHTML = '<div class="empty-state"><p>No consensus data for this event</p></div>';
            return;
        }
        el.innerHTML = `
            <div class="stats-grid" style="margin:0">
                ${outcomes.map(o => `
                    <div class="stat-card card-3d-tilt">
                        <div class="stat-label">${o.name}</div>
                        <div class="stat-value font-mono">${o.consensus_american > 0 ? '+' : ''}${o.consensus_american}</div>
                        <div class="stat-sub">
                            Best: <strong class="text-green">${o.best_odds > 0 ? '+' : ''}${o.best_odds}</strong> (${o.best_book})
                            | Fair: ${(o.no_vig_prob * 100).toFixed(1)}%
                        </div>
                    </div>
                `).join('')}
            </div>
        `;
        SBA.toast('Consensus loaded', 'success');
    } catch (err) {
        SBA.toast('Error: ' + err.message, 'error');
    }
}

document.addEventListener('DOMContentLoaded', () => {
    loadSports();
    loadOddsScreen();
});
</script>
{% endblock %}
